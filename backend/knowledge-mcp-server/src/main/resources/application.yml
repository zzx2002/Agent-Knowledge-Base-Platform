server:
  port: 8081

spring:
  application:
    name: knowledge-mcp-server
  main:
    web-application-type: servlet

kb:
  api:
    base-url: ${KB_API_BASE_URL:http://localhost:8080/api/v1}
  mcp:
    endpoint: /mcp
  security:
    jwt:
      issuer: ${KB_JWT_ISSUER:http://localhost:8080}
      secret: ${KB_JWT_SECRET:change-me-change-me-change-me-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
