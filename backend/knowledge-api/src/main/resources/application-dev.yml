spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_base}
    username: ${DB_USER:kb_user}
    password: ${DB_PASSWORD:change_me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}

# 开发环境保留更详细的日志，方便第一阶段联调。
logging:
  level:
    com.agentkb: DEBUG
    org.springframework.web: INFO
    org.mybatis: INFO

# 本地开发默认管理员：admin / admin123（见 V1__init.sql 中的 BCrypt 哈希）。
