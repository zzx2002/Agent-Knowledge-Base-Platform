server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: knowledge-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledge_base}
    username: ${DB_USER:kb_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: ${MQ_CONCURRENCY:2}
        max-concurrency: ${MQ_MAX_CONCURRENCY:8}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:/mapper/**/*.xml

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:kb_admin}
  secret-key: ${MINIO_SECRET_KEY:change_me}
  bucket: ${MINIO_BUCKET:knowledge-base}
  base-path: ${MINIO_BASE_PATH:documents}

jwt:
  secret: ${JWT_SECRET:agentkb-local-development-secret-key-please-change-in-production-2026}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:knowledge-api}

kb:
  callback:
    token: ${TASK_CALLBACK_TOKEN:}
  search:
    es:
      url: ${ES_URL:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:}
      index: ${ES_INDEX:kb_chunks}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      api-key: ${QDRANT_API_KEY:}
      collection: ${QDRANT_COLLECTION:kb_chunks}
      dimension: ${EMBEDDING_DIM:1024}
    embedding:
      url: ${EMBEDDING_SERVICE_URL:http://localhost:8002}
      model: ${EMBEDDING_MODEL:bge-m3}
    rerank:
      url: ${RERANK_SERVICE_URL:http://localhost:8003}
      model: ${RERANKER_MODEL:bge-reranker}
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method

logging:
  level:
    com.agentkb: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
